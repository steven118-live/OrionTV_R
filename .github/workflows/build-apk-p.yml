name: Build Android APK Personal

on:
  push:
    branches:
      - "*"
    tags-ignore:
      - '**'
  workflow_dispatch:
    inputs:
      custom_version:
        description: "輸入版本號（tag 模式必填，例如 1.3.11.004）"
        required: false
      buildMode:
        description: "建置模式 (full=乾淨建置 / incremental=增量建置)"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - incremental
      buildTarget:
        description: "建置來源 (branch / tag)"
        required: true
        default: "branch"
        type: choice
        options:
          - branch
          - tag

permissions:
  contents: write

jobs:
  release_build:
    runs-on: ubuntu-latest
    env:
      USER_NAME: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Validate inputs for tag builds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.buildTarget == 'tag' }}
        run: |
          if [ -z "${{ inputs.custom_version }}" ]; then
            echo "ERROR: tag build requires 'custom_version' (e.g., 1.3.11.004)"
            exit 1
          fi
          TAG="v${{ inputs.custom_version }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "ERROR: Tag ${TAG} not found on remote."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.buildTarget == 'tag') && format('v{0}', inputs.custom_version) || github.ref }}

      - name: Log Build Info
        run: |
          echo "Target Type: ${{ inputs.buildTarget || 'push' }}"
          echo "Current Commit: $(git rev-parse HEAD)"
          echo "Current Ref: ${{ github.ref }}"

      - name: Generate BuildEnv.ts
        run: |
          mkdir -p constants
          echo "export const BUILD_ENV = {
            USER_NAME: '${{ env.USER_NAME }}',
            REPO_NAME: '${{ env.REPO_NAME }}',
            BRANCH_NAME: '${{ env.BRANCH_NAME }}'
          };" > constants/BuildEnv.ts

      - name: Show BuildEnv
        run: cat constants/BuildEnv.ts

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Install dependencies
        run: |
          if [ "${{ inputs.buildMode }}" = "full" ]; then
            rm -rf node_modules
            yarn cache clean
          fi
          yarn install --frozen-lockfile

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name == 'workflow_dispatch' && inputs.buildTarget == 'tag' }}" == "true" ]]; then
            echo "version=${{ inputs.custom_version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Prebuild TV App
        run: yarn prebuild

      - name: Update Android versionCode and versionName
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -ra PARTS <<< "$VERSION"
          p1=${PARTS[0]:-0} p2=${PARTS[1]:-0} p3=${PARTS[2]:-0} p4=${PARTS[3]:-0}
          CODE=$(printf "%d%03d%03d%03d" $((10#$p1)) $((10#$p2)) $((10#$p3)) $((10#$p4)))
          sed -i "s/versionCode .*/versionCode ${CODE}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          echo "Updated to Code: $CODE, Name: $VERSION"

      - name: Build TV APK
        run: yarn build

      - name: Rename APK file
        id: rename-apk
        run: |
          mkdir -p artifacts
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ inputs.buildTarget }}" == "tag" ]]; then
            FINAL_NAME="${VERSION}"
          else
            BRANCH_SAFE="${BRANCH_NAME//\//-}"
            FINAL_NAME="${VERSION}-${BRANCH_SAFE}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/orionTV.${FINAL_NAME}.apk"
          echo "apk_version=${FINAL_NAME}" >> $GITHUB_OUTPUT
          echo "target_tag=v${VERSION}" >> $GITHUB_OUTPUT

      # 核心逻辑：如果是 Branch/Push 模式，且 Tag 不存在，就自动建立 Tag
      - name: Auto Tagging (Branch/Push mode only)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.buildTarget == 'branch') }}
        run: |
          TAG_NAME="${{ steps.rename-apk.outputs.target_tag }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG_NAME}$"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $TAG_NAME
            git push origin $TAG_NAME
            echo "Successfully created and pushed tag $TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists, skipping."
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename-apk.outputs.target_tag }}
          name: Release ${{ steps.rename-apk.outputs.target_tag }}
          body: |
            Automated Build
            - Commit: ${{ github.sha }}
            - Mode: ${{ inputs.buildTarget || 'git-push' }}
            - Source Branch: ${{ github.ref_name }}
          files: artifacts/orionTV.${{ steps.rename-apk.outputs.apk_version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
